<style>
/* 관리자 화면. AppCss 를 그대로 쓰고 여기서 필요한 것만 더한다. */

.alerts { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; }
.alert {
  padding: 8px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
}
.alert.warn { background: #fff7ed; color: var(--warn); }
.alert.danger { background: #fef2f2; color: var(--danger); }
.alert.info { background: #eef2ff; color: var(--brand-dark); }

/* ── 날짜 이동 ─────────────────────────────────────────────── */

.daybar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.daybar input[type="date"] {
  height: 46px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  font-variant-numeric: tabular-nums;
}
.day-nav {
  width: 46px; height: 46px; border-radius: 10px;
  background: #eef0f3; font-size: 15px; color: var(--ink-soft);
}
.day-nav:active { background: #e2e5ea; }
.day-today {
  height: 46px; padding: 0 14px; border-radius: 10px;
  background: #eef2ff; color: var(--brand-dark); font-size: 14px; font-weight: 600;
}
.grow { flex: 1; }
.add-btn {
  height: 46px; padding: 0 16px; border-radius: 10px;
  background: var(--brand); color: #fff; font-size: 14px; font-weight: 600;
}
.add-btn:active { background: var(--brand-dark); }

/* ── 이름 검색 ─────────────────────────────────────────────── */

.searchrow {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.searchbox { position: relative; flex: 1; min-width: 0; }
.searchbox input {
  width: 100%; height: 44px; padding: 0 40px 0 14px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.searchbox input:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(47, 111, 235, .15);
}
.clear-x {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 14px;
  background: #e2e5ea; color: var(--ink-soft); font-size: 15px; line-height: 1;
}
.rec-count {
  flex: 0 0 auto; font-size: 13px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.content-scroll { flex: 1; overflow-y: auto; padding: 12px 16px 32px; }

/* ── 기록 목록 ─────────────────────────────────────────────── */

.record-list { display: flex; flex-direction: column; gap: 8px; }
.record {
  display: flex; align-items: center; gap: 12px;
  min-height: 64px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  text-align: left; width: 100%;
}
.record:active { background: #f7f8fa; }
.record.cancelled { opacity: .55; }
.record.cancelled .rec-name { text-decoration: line-through; }

.rec-time {
  flex: 0 0 58px; font-size: 18px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.rec-body { flex: 1; min-width: 0; }
.rec-name { font-size: 16px; font-weight: 700; }
.rec-meta {
  margin-top: 3px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  font-size: 12px; color: var(--ink-soft);
}
.tag {
  padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700;
}
.tag.in { background: #e3f4ea; color: var(--in-dark); }
.tag.out { background: #fbeedd; color: var(--out-dark); }
.tag.sent { background: #e3f4ea; color: var(--in-dark); }
.tag.wait { background: #eef0f3; color: var(--ink-soft); }
.tag.failed { background: #fef2f2; color: var(--danger); }
.tag.skip { background: #f4f0ff; color: #5b21b6; }
.tag.edited { background: #fff7ed; color: var(--warn); }
.rec-arrow { flex: 0 0 auto; color: var(--ink-soft); font-size: 18px; }

/* ── 수정 대화상자 ─────────────────────────────────────────── */

.edit-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px;
}
.edit-act {
  min-height: 58px; border-radius: 12px;
  background: #eef0f3; font-size: 15px; font-weight: 600;
}
.edit-act:active { background: #e2e5ea; }
.edit-act.on { background: var(--brand); color: #fff; }
.edit-act.danger { background: #fef2f2; color: var(--danger); }
.edit-act.danger.on { background: var(--danger); color: #fff; }

.edit-form { margin-top: 16px; }
.edit-time-row { display: flex; gap: 10px; }
.edit-time-row input[type="date"] {
  flex: 1; height: 52px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.time-btn {
  flex: 0 0 110px; height: 52px; border-radius: 10px;
  background: #fff; border: 2px solid var(--brand); color: var(--ink);
  font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.time-btn:active { background: #f0f5ff; }

.kind-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kind-btn {
  min-height: 52px; border-radius: 10px;
  background: #fff; border: 2px solid var(--line);
  font-size: 15px; font-weight: 600;
}
.kind-btn.on { border-color: var(--brand); background: #f0f5ff; color: var(--brand-dark); }

.notify-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding: 12px;
  background: #f7f8fa; border-radius: 10px; font-size: 14px;
}
.notify-row input { width: 22px; height: 22px; }

/* ── 기록 추가 ─────────────────────────────────────────────── */

.add-results { max-height: 240px; overflow-y: auto; margin-bottom: 12px; }
.add-result {
  display: block; width: 100%; padding: 12px 14px; text-align: left;
  border-bottom: 1px solid var(--line); background: #fff;
}
.add-result:active { background: #f0f5ff; }
.add-result strong { font-size: 15px; }
.add-result small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
.picked-student {
  margin-bottom: 16px; padding: 12px 14px;
  background: #f0f5ff; border-radius: 10px;
  font-size: 15px; font-weight: 700;
}

/* ── 이력 ──────────────────────────────────────────────────── */

.history-box {
  margin-top: 24px; padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
}
.history-box summary {
  cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink-soft);
}
.history-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.history-item {
  padding: 10px 12px; background: #f7f8fa; border-radius: 8px; font-size: 13px;
}
.history-item .h-head { font-weight: 700; margin-bottom: 3px; }
.history-item .h-body { color: var(--ink-soft); line-height: 1.6; }
.history-item .h-reason { margin-top: 4px; color: var(--ink); }
</style>
