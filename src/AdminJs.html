<script>
/**
 * 관리자 화면 클라이언트.
 *
 * 태블릿 앱과 달리 여기서는 낙관적 UI 를 쓰지 않는다.
 * 기록을 고치는 화면이라 "됐다고 보였는데 실제로는 실패" 가 가장 나쁘다.
 * 서버 응답을 받고 나서 목록을 다시 그린다.
 */
(function () {
  'use strict';

  var LS = { token: 'attend.token' };

  var state = {
    token: null,
    ticket: null,
    ticketUntil: 0,
    academy: '',
    date: '',
    query: '',         // 목록 이름 검색 (초성 가능)
    records: [],
    roster: [],
    editing: null,     // 지금 고치는 기록
    mode: '',          // time | kind | resend | cancel
    editAt: null,      // 수정할 시각 (Date)
    addStudent: null,
    addAt: null,
    addKind: '등원',
    addSubjects: []
  };

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var hhmm = function (d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var ymd = function (d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  var isoOf = function (d) { return ymd(d) + ' ' + hhmm(d) + ':00'; };

  function call(fn, args) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) {
          reject(new Error(e && e.message ? e.message : String(e)));
        })[fn].apply(null, args || []);
    });
  }

  var toastTimer = null;
  function toast(msg, isError) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'toast' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('hidden'); }, isError ? 4500 : 2600);
  }

  /* ── 초성 (검색용) ───────────────────────────────────────── */

  var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ',
             'ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function chosung(s) {
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      out += (c >= 0xac00 && c <= 0xd7a3) ? CHO[Math.floor((c - 0xac00) / 588)] : s.charAt(i);
    }
    return out;
  }

  /* ── 부팅 ────────────────────────────────────────────────── */

  function boot() {
    var fromUrl = (window.__BOOT__ && window.__BOOT__.token) || '';
    state.token = fromUrl || lsGet(LS.token);

    // 태블릿에서 톱니바퀴로 이미 풀고 넘어왔으면 PIN 을 다시 묻지 않는다.
    // 유효한지는 서버가 판단한다. 틀리면 needsUnlock 으로 잠금 화면이 뜬다.
    state.ticket = (window.__BOOT__ && window.__BOOT__.adminTicket) || null;
    state.date = ymd(new Date());

    call('adminBootstrap', [state.token, state.ticket]).then(function (res) {
      state.academy = res.academy || '';
      $('academyName').textContent = state.academy;

      if (res.needsRegister) {
        showLock('이 기기가 등록되지 않았습니다. 태블릿 앱에서 먼저 기기를 등록해주세요.');
        $('lockSubmit').disabled = true;
        return;
      }
      if (res.needsUnlock) { state.ticket = null; showLock(); return; }

      setTicketWindow(res.ticketLeftMs, res.minutes);
      showMain(res.summary);
    }).catch(function (e) {
      showLock('서버에 연결하지 못했습니다: ' + e.message);
    });
  }

  function lsGet(k) {
    try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; }
  }

  function showLock(reason) {
    $('main').classList.add('hidden');
    $('lock').classList.remove('hidden');
    if (reason) $('lockReason').textContent = reason;
  }

  function showMain(summary) {
    $('lock').classList.add('hidden');
    $('main').classList.remove('hidden');
    $('dayInput').value = state.date;
    $('dayInput').max = ymd(new Date());
    renderAlerts(summary);
    loadDay();
    loadHistory();
  }

  function unlock() {
    var pin = $('lockPin').value.trim();
    var err = $('lockError');
    err.classList.add('hidden');
    if (!pin) { err.textContent = '관리자 PIN 을 입력해주세요.'; err.classList.remove('hidden'); return; }

    $('lockSubmit').disabled = true;
    call('unlockAdmin', [state.token, pin]).then(function (res) {
      $('lockSubmit').disabled = false;
      if (!res.ok) { err.textContent = res.message; err.classList.remove('hidden'); return; }
      state.ticket = res.ticket;
      setTicketWindow(res.minutes * 60000, res.minutes);
      $('lockPin').value = '';
      return call('adminBootstrap', [state.token, state.ticket]).then(function (b) {
        if (handleAuth(b)) return;
        setTicketWindow(b.ticketLeftMs, b.minutes);
        showMain(b.summary);
      });
    }).catch(function (e) {
      $('lockSubmit').disabled = false;
      err.textContent = e.message;
      err.classList.remove('hidden');
    });
  }

  /**
   * 남은 인증 시간을 잡는다.
   *
   * 값이 없거나 0 이면 곧바로 잠기는데, 서버가 방금 "유효하다" 고 답한 티켓을
   * 0분으로 보고 잠그면 PIN 을 넣자마자 다시 묻는 꼴이 된다.
   * 알 수 없을 때는 기본 창을 준다. 진짜 만료는 서버가 needsUnlock 으로 알려준다.
   */
  function setTicketWindow(leftMs, minutes) {
    var left = Number(leftMs);
    if (!(left > 0)) left = (Number(minutes) || 30) * 60000;
    state.ticketUntil = Date.now() + left;
  }

  /** 티켓이 만료되면 조용히 실패하지 않고 다시 잠근다. */
  function handleAuth(res) {
    if (res && res.needsUnlock) {
      state.ticket = null;
      showLock('관리자 인증이 만료되었습니다. PIN 을 다시 입력해주세요.');
      return true;
    }
    return false;
  }

  /* ── 요약 배지 ───────────────────────────────────────────── */

  function renderAlerts(s) {
    var box = $('alerts');
    box.innerHTML = '';
    if (!s) return;

    var items = [];
    if (s.발송실패) items.push(['danger', '발송 실패 ' + s.발송실패 + '건']);
    if (s.발송대기) items.push(['info', '발송 대기 ' + s.발송대기 + '건']);
    if (s.연락처미등록) items.push(['warn', '연락처 미등록 ' + s.연락처미등록 + '명']);
    if (s.출석부미매핑) items.push(['warn', '출석부 미매핑 ' + s.출석부미매핑 + '명']);
    if (s.확인필요) items.push(['danger', '상태 확인필요 ' + s.확인필요 + '명']);

    items.forEach(function (it) {
      var el = document.createElement('span');
      el.className = 'alert ' + it[0];
      el.textContent = it[1];
      box.appendChild(el);
    });
  }

  /* ── 하루치 목록 ─────────────────────────────────────────── */

  function loadDay() {
    call('adminListDay', [state.token, state.ticket, state.date]).then(function (res) {
      if (handleAuth(res)) return;
      if (!res.ok) { toast(res.message, true); return; }
      state.records = res.records || [];
      renderRecords();
    }).catch(function (e) { toast(e.message, true); });
  }

  /**
   * 이름·초성으로 거른다.
   *
   * 하루치가 100건을 넘으면 눈으로 훑기 어렵다. 검색은 이미 받아 둔 목록에서
   * 하므로 서버를 다시 부르지 않는다.
   */
  function filteredRecords() {
    var q = state.query;
    if (!q) return state.records;

    // 자음만 쳤을 때만 초성으로 본다.
    // 완성된 글자까지 초성으로 대조하면 "황" 이 "김하늘"(ㅇㄱㅎ) 을 잡는다.
    var byChosung = /^[ㄱ-ㅎ]+$/.test(q);

    return state.records.filter(function (r) {
      var n = r.name || '';
      return byChosung ? chosung(n).indexOf(q) !== -1 : n.indexOf(q) !== -1;
    });
  }

  function renderRecords() {
    var box = $('recordList');
    box.innerHTML = '';

    var list = filteredRecords();
    var empty = $('emptyDay');
    empty.classList.toggle('hidden', list.length > 0);
    empty.textContent = state.query
      ? '"' + state.query + '" 와 맞는 기록이 없습니다.'
      : '이 날짜에는 기록이 없습니다.';

    $('recCount').textContent = state.query
      ? list.length + ' / ' + state.records.length + '건'
      : (state.records.length ? state.records.length + '건' : '');

    list.forEach(function (r) {
      var el = document.createElement('button');
      el.className = 'record' + (r.status === '취소됨' ? ' cancelled' : '');
      el.addEventListener('click', function () { openEdit(r); });

      var time = document.createElement('div');
      time.className = 'rec-time';
      time.textContent = r.at;
      el.appendChild(time);

      var body = document.createElement('div');
      body.className = 'rec-body';

      var name = document.createElement('div');
      name.className = 'rec-name';
      name.textContent = r.name + (r.subject ? ' · ' + r.subject : '');
      body.appendChild(name);

      var meta = document.createElement('div');
      meta.className = 'rec-meta';
      meta.appendChild(tag(r.kind === '하원' ? 'out' : 'in', r.kind));
      meta.appendChild(sendTag(r.send));
      if (r.status === '수정됨') meta.appendChild(tag('edited', '수정됨'));
      if (r.adjusted) {
        var adj = document.createElement('span');
        adj.textContent = '입력 ' + r.enteredAt;
        meta.appendChild(adj);
      }
      if (r.device) {
        var dev = document.createElement('span');
        dev.textContent = r.device;
        meta.appendChild(dev);
      }
      body.appendChild(meta);
      el.appendChild(body);

      var arrow = document.createElement('div');
      arrow.className = 'rec-arrow';
      arrow.textContent = '›';
      el.appendChild(arrow);

      box.appendChild(el);
    });
  }

  function tag(cls, text) {
    var el = document.createElement('span');
    el.className = 'tag ' + cls;
    el.textContent = text;
    return el;
  }

  function sendTag(send) {
    if (send === '성공') return tag('sent', '발송됨');
    if (send === '실패') return tag('failed', '발송 실패');
    if (send === '대기') return tag('wait', '발송 대기');
    return tag('skip', send.replace('미발송', '').replace(/[()]/g, '') || '미발송');
  }

  /* ── 이력 ────────────────────────────────────────────────── */

  function loadHistory() {
    call('adminHistory', [state.token, state.ticket, 30]).then(function (res) {
      if (!res || !res.ok) return;
      var box = $('historyList');
      box.innerHTML = '';
      if (!res.items.length) {
        box.textContent = '아직 변경 이력이 없습니다.';
        return;
      }
      res.items.forEach(function (h) {
        var el = document.createElement('div');
        el.className = 'history-item';

        var head = document.createElement('div');
        head.className = 'h-head';
        head.textContent = h.action + (h.target ? ' · ' + h.target : '');
        el.appendChild(head);

        var body = document.createElement('div');
        body.className = 'h-body';
        body.textContent = h.at + (h.by ? ' · ' + h.by : '') +
          (h.field ? '\n' + h.field + ': ' + h.before + ' → ' + h.after : '');
        el.appendChild(body);

        if (h.reason) {
          var reason = document.createElement('div');
          reason.className = 'h-reason';
          reason.textContent = '사유: ' + h.reason;
          el.appendChild(reason);
        }
        box.appendChild(el);
      });
    }).catch(function () { /* 이력은 실패해도 화면을 막지 않는다 */ });
  }

  /* ── 기록 수정 ───────────────────────────────────────────── */

  function openEdit(rec) {
    state.editing = rec;
    state.mode = '';
    state.editAt = null;

    $('editName').textContent = rec.name;
    $('editSub').textContent = [
      state.date, rec.kind, rec.at,
      rec.subject || '', rec.status, rec.send
    ].filter(Boolean).join(' · ');

    ['actTime', 'actKind', 'actResend', 'actCancel'].forEach(function (id) {
      $(id).classList.remove('on');
    });
    $('editForm').classList.add('hidden');
    $('editError').classList.add('hidden');
    $('editReason').value = '';
    $('editResend').checked = false;

    // 취소된 기록은 더 손댈 수 없다
    var done = rec.status === '취소됨';
    ['actTime', 'actKind', 'actCancel'].forEach(function (id) { $(id).disabled = done; });
    $('actResend').disabled = done || rec.send === '성공';

    $('editBackdrop').classList.remove('hidden');
    $('editDialog').classList.remove('hidden');
  }

  function closeEdit() {
    $('editDialog').classList.add('hidden');
    $('editBackdrop').classList.add('hidden');
    state.editing = null;
    state.mode = '';
  }

  function chooseMode(mode) {
    state.mode = mode;
    ['actTime', 'actKind', 'actResend', 'actCancel'].forEach(function (id) {
      $(id).classList.remove('on');
    });
    $({ time: 'actTime', kind: 'actKind', resend: 'actResend', cancel: 'actCancel' }[mode]).classList.add('on');

    $('editTimeRow').classList.toggle('hidden', mode !== 'time');
    $('editKindRow').classList.toggle('hidden', mode !== 'kind');
    $('resendRow').classList.toggle('hidden', mode !== 'time');
    $('editForm').classList.remove('hidden');
    $('editError').classList.add('hidden');

    $('reasonLabel').textContent =
      mode === 'cancel' ? '취소 사유 (필수)' :
      mode === 'resend' ? '재발송 사유' : '수정 사유 (필수)';
    $('editSubmit').textContent =
      mode === 'cancel' ? '기록 취소' :
      mode === 'resend' ? '다시 보내기' : '적용';

    if (mode === 'time') {
      var parts = state.editing.at.split(':');
      var d = new Date(state.date + 'T00:00:00');
      d.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
      state.editAt = d;
      $('editDate').value = ymd(d);
      $('editDate').max = ymd(new Date());
      $('editTimeBtn').textContent = hhmm(d);
    }
    if (mode === 'kind') {
      var next = state.editing.kind === '등원' ? '하원' : '등원';
      setKindButtons('editKindRow', next);
    }
  }

  function setKindButtons(rowId, kind) {
    var row = $(rowId);
    Array.prototype.forEach.call(row.querySelectorAll('.kind-btn'), function (b) {
      b.classList.toggle('on', b.dataset.kind === kind);
    });
  }

  function pickedKind(rowId) {
    var on = $(rowId).querySelector('.kind-btn.on');
    return on ? on.dataset.kind : '';
  }

  function submitEdit() {
    var rec = state.editing;
    if (!rec || !state.mode) return;

    var reason = $('editReason').value.trim();
    var err = $('editError');
    err.classList.add('hidden');

    if (state.mode !== 'resend' && !reason) {
      err.textContent = '사유를 입력해주세요.';
      err.classList.remove('hidden');
      return;
    }

    var fn, args;
    if (state.mode === 'time') {
      var d = new Date($('editDate').value + 'T00:00:00');
      d.setHours(state.editAt.getHours(), state.editAt.getMinutes(), 0, 0);
      fn = 'adminEditTime';
      args = [{
        token: state.token, ticket: state.ticket, recordId: rec.id,
        atIso: isoOf(d), reason: reason, resend: $('editResend').checked
      }];
    } else if (state.mode === 'kind') {
      fn = 'adminEditKind';
      args = [{
        token: state.token, ticket: state.ticket, recordId: rec.id,
        kind: pickedKind('editKindRow'), reason: reason
      }];
    } else if (state.mode === 'cancel') {
      fn = 'adminCancel';
      args = [{ token: state.token, ticket: state.ticket, recordId: rec.id, reason: reason }];
    } else {
      fn = 'adminResend';
      args = [{ token: state.token, ticket: state.ticket, recordId: rec.id, reason: reason }];
    }

    $('editSubmit').disabled = true;
    call(fn, args).then(function (res) {
      $('editSubmit').disabled = false;
      if (handleAuth(res)) return;
      if (!res.ok) { err.textContent = res.message; err.classList.remove('hidden'); return; }
      closeEdit();
      toast(res.message);
      refresh();
    }).catch(function (e) {
      $('editSubmit').disabled = false;
      err.textContent = e.message;
      err.classList.remove('hidden');
    });
  }

  /* ── 기록 추가 ───────────────────────────────────────────── */

  function openAdd() {
    state.addStudent = null;
    state.addKind = '등원';
    state.addSubjects = [];
    var now = new Date();
    var d = new Date(state.date + 'T00:00:00');
    d.setHours(now.getHours(), now.getMinutes(), 0, 0);
    if (d.getTime() > now.getTime()) d.setTime(now.getTime());
    state.addAt = d;

    $('addSearch').value = '';
    $('addReason').value = '';
    $('addNotify').checked = false;
    $('addError').classList.add('hidden');
    $('addDetail').classList.add('hidden');
    $('addResults').innerHTML = '';
    setKindButtons('addDialog', '등원');

    $('addBackdrop').classList.remove('hidden');
    $('addDialog').classList.remove('hidden');

    if (!state.roster.length) {
      call('adminRoster', [state.token, state.ticket]).then(function (res) {
        if (handleAuth(res)) return;
        if (res.ok) state.roster = res.students || [];
      }).catch(function () {});
    }
  }

  function closeAdd() {
    $('addDialog').classList.add('hidden');
    $('addBackdrop').classList.add('hidden');
  }

  function searchStudents() {
    var q = $('addSearch').value.trim();
    var box = $('addResults');
    box.innerHTML = '';
    if (!q) return;

    var qc = chosung(q);
    var hits = state.roster.filter(function (s) {
      return s.name.indexOf(q) !== -1 || (s.chosung || '').indexOf(qc) !== -1;
    }).slice(0, 12);

    hits.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'add-result';
      var strong = document.createElement('strong');
      strong.textContent = s.name + (s.onLeave ? ' (휴원 중)' : '');
      b.appendChild(strong);
      var small = document.createElement('small');
      small.textContent = (s.subject || '') + (s.hasPhone ? '' : ' · 연락처 미등록');
      b.appendChild(small);
      b.addEventListener('click', function () { pickStudent(s); });
      box.appendChild(b);
    });
  }

  function pickStudent(s) {
    state.addStudent = s;
    state.addSubjects = (s.subjects || []).slice();
    $('addResults').innerHTML = '';
    $('addSearch').value = s.name;
    $('addPicked').textContent = s.name + (s.subject ? ' · ' + s.subject : '');
    $('addDate').value = ymd(state.addAt);
    $('addDate').max = ymd(new Date());
    $('addTimeBtn').textContent = hhmm(state.addAt);
    renderAddSubjects();
    $('addDetail').classList.remove('hidden');
  }

  function renderAddSubjects() {
    var list = (state.addStudent && state.addStudent.subjects) || [];
    $('addSubjects').classList.toggle('hidden', list.length < 2);
    if (list.length < 2) return;

    var box = $('addSubjectChips');
    box.innerHTML = '';
    list.forEach(function (sub) {
      var on = state.addSubjects.indexOf(sub) !== -1;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'subject-chip' + (on ? ' on' : '');
      var tick = document.createElement('span');
      tick.className = 'tick';
      tick.textContent = '✓';
      b.appendChild(tick);
      var label = document.createElement('span');
      label.textContent = sub;
      b.appendChild(label);
      b.addEventListener('click', function () {
        var i = state.addSubjects.indexOf(sub);
        if (i === -1) state.addSubjects.push(sub);
        else state.addSubjects.splice(i, 1);
        if (!state.addSubjects.length) {
          state.addSubjects = [sub];
          toast('수업을 최소 하나는 골라야 합니다.', true);
        }
        renderAddSubjects();
      });
      box.appendChild(b);
    });
  }

  function submitAdd() {
    var err = $('addError');
    err.classList.add('hidden');
    if (!state.addStudent) {
      err.textContent = '학생을 골라주세요.'; err.classList.remove('hidden'); return;
    }
    var reason = $('addReason').value.trim();
    if (!reason) { err.textContent = '사유를 입력해주세요.'; err.classList.remove('hidden'); return; }

    var d = new Date($('addDate').value + 'T00:00:00');
    d.setHours(state.addAt.getHours(), state.addAt.getMinutes(), 0, 0);

    $('addSubmit').disabled = true;
    call('adminAddRecord', [{
      token: state.token, ticket: state.ticket,
      studentId: state.addStudent.id,
      kind: pickedKind('addDialog'),
      atIso: isoOf(d),
      subjects: state.addSubjects,
      notify: $('addNotify').checked,
      reason: reason
    }]).then(function (res) {
      $('addSubmit').disabled = false;
      if (handleAuth(res)) return;
      if (!res.ok) { err.textContent = res.message; err.classList.remove('hidden'); return; }
      closeAdd();
      toast(res.message + (res.notified ? '' : ' (알림 없음)'));
      state.date = res.date;
      $('dayInput').value = res.date;
      refresh();
    }).catch(function (e) {
      $('addSubmit').disabled = false;
      err.textContent = e.message;
      err.classList.remove('hidden');
    });
  }

  /* ── 시각 피커 (앱과 같은 굴림판) ────────────────────────── */

  var ITEM_H = 48;
  var picker = { hour: 0, min: 0, timer: null, target: null };

  function buildWheel(el, count, selected) {
    el.innerHTML = '';
    for (var i = 0; i < count; i++) {
      var d = document.createElement('div');
      d.className = 'wheel-item';
      d.textContent = pad(i);
      d.dataset.value = i;
      el.appendChild(d);
    }
    el.scrollTop = selected * ITEM_H;
  }

  function markWheel(el, value) {
    for (var i = 0; i < el.children.length; i++) {
      el.children[i].classList.toggle('on', i === value);
    }
  }

  function refreshPreview() {
    $('timePreview').textContent = pad(picker.hour) + ':' + pad(picker.min);
    markWheel($('wheelHour'), picker.hour);
    markWheel($('wheelMin'), picker.min);
  }

  function openTimePicker(which) {
    picker.target = which;
    var cur = which === 'add' ? state.addAt : state.editAt;
    if (!cur) cur = new Date();
    picker.hour = cur.getHours();
    picker.min = cur.getMinutes();
    buildWheel($('wheelHour'), 24, picker.hour);
    buildWheel($('wheelMin'), 60, picker.min);
    refreshPreview();
    $('timeBackdrop').classList.remove('hidden');
    $('timeDialog').classList.remove('hidden');
  }

  function closeTimePicker() {
    $('timeDialog').classList.add('hidden');
    $('timeBackdrop').classList.add('hidden');
  }

  function applyTimePicker() {
    var d = new Date(picker.target === 'add' ? state.addAt : state.editAt);
    d.setHours(picker.hour, picker.min, 0, 0);
    if (picker.target === 'add') {
      state.addAt = d;
      $('addTimeBtn').textContent = hhmm(d);
    } else {
      state.editAt = d;
      $('editTimeBtn').textContent = hhmm(d);
    }
    closeTimePicker();
  }

  /* ── 새로고침 ────────────────────────────────────────────── */

  function refresh() {
    call('adminBootstrap', [state.token, state.ticket]).then(function (res) {
      if (handleAuth(res)) return;
      renderAlerts(res.summary);
    }).catch(function () {});
    loadDay();
    loadHistory();
  }

  function shiftDay(delta) {
    var d = new Date(state.date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    if (d.getTime() > new Date().getTime()) return;
    state.date = ymd(d);
    $('dayInput').value = state.date;
    loadDay();
  }

  /* ── 이벤트 ──────────────────────────────────────────────── */

  function init() {
    $('recSearch').addEventListener('input', function (e) {
      state.query = e.target.value.trim();
      $('recSearchClear').classList.toggle('hidden', !state.query);
      renderRecords();
    });
    $('recSearchClear').addEventListener('click', function () {
      state.query = '';
      $('recSearch').value = '';
      $('recSearchClear').classList.add('hidden');
      renderRecords();
    });

    $('lockSubmit').addEventListener('click', unlock);
    $('lockPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

    $('prevDay').addEventListener('click', function () { shiftDay(-1); });
    $('nextDay').addEventListener('click', function () { shiftDay(1); });
    $('todayBtn').addEventListener('click', function () {
      state.date = ymd(new Date());
      $('dayInput').value = state.date;
      loadDay();
    });
    $('dayInput').addEventListener('change', function (e) {
      if (!e.target.value) return;
      state.date = e.target.value;
      loadDay();
    });
    $('refreshBtn').addEventListener('click', function () { refresh(); toast('새로고침했습니다.'); });

    $('actTime').addEventListener('click', function () { chooseMode('time'); });
    $('actKind').addEventListener('click', function () { chooseMode('kind'); });
    $('actResend').addEventListener('click', function () { chooseMode('resend'); });
    $('actCancel').addEventListener('click', function () { chooseMode('cancel'); });
    $('editSubmit').addEventListener('click', submitEdit);
    $('editClose').addEventListener('click', closeEdit);
    $('editBackdrop').addEventListener('click', closeEdit);
    $('editTimeBtn').addEventListener('click', function () { openTimePicker('edit'); });

    Array.prototype.forEach.call($('editKindRow').querySelectorAll('.kind-btn'), function (b) {
      b.addEventListener('click', function () { setKindButtons('editKindRow', b.dataset.kind); });
    });

    $('addBtn').addEventListener('click', openAdd);
    $('addClose').addEventListener('click', closeAdd);
    $('addBackdrop').addEventListener('click', closeAdd);
    $('addSubmit').addEventListener('click', submitAdd);
    $('addTimeBtn').addEventListener('click', function () { openTimePicker('add'); });

    var searchTimer = null;
    $('addSearch').addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(searchStudents, 60);
    });
    Array.prototype.forEach.call($('addDialog').querySelectorAll('.kind-btn'), function (b) {
      b.addEventListener('click', function () { setKindButtons('addDialog', b.dataset.kind); });
    });

    $('timeApply').addEventListener('click', applyTimePicker);
    $('timeCancel').addEventListener('click', closeTimePicker);
    $('timeBackdrop').addEventListener('click', closeTimePicker);
    [['wheelHour', 'hour'], ['wheelMin', 'min']].forEach(function (pairArr) {
      var el = $(pairArr[0]);
      el.addEventListener('scroll', function () {
        clearTimeout(picker.timer);
        picker.timer = setTimeout(function () {
          picker[pairArr[1]] = Math.max(0, Math.min(
            el.children.length - 1, Math.round(el.scrollTop / ITEM_H)));
          refreshPreview();
        }, 90);
      });
      el.addEventListener('click', function (e) {
        var v = e.target && e.target.dataset ? e.target.dataset.value : null;
        if (v === null || v === undefined) return;
        el.scrollTo({ top: Number(v) * ITEM_H, behavior: 'smooth' });
        picker[pairArr[1]] = Number(v);
        refreshPreview();
      });
    });

    // 티켓 남은 시간 표시
    setInterval(function () {
      if (!state.ticket) { $('ticketLeft').textContent = ''; return; }
      var ms = state.ticketUntil - Date.now();
      if (isNaN(ms)) return;            // 값이 깨졌다고 잠그지는 않는다
      var left = Math.max(0, Math.ceil(ms / 60000));
      $('ticketLeft').textContent = left ? left + '분 남음' : '';
      if (!left) { state.ticket = null; showLock('관리자 인증이 만료되었습니다.'); }
    }, 1000);
  }

  init();
  boot();
})();
</script>
